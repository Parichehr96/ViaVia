<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 108" fill="#2e3b3b">
  <!-- Hub at (50, 54). Four blades extend ~46px out, each ≈ 12px wide.
       Each blade has 9 internal slat strokes for the lattice look. -->
  <g transform="translate(50 54)">
    <!-- Blade group: 4 copies rotated 0/90/180/270 around hub.
         Each blade is a long rectangle pointing outward, with vertical
         strokes inside to suggest the wood lattice. -->
    <g>
      <rect x="6" y="-6" width="44" height="12"/>
      <g stroke="#e0eaeb" stroke-width="1">
        <line x1="11" y1="-5" x2="11" y2="5"/>
        <line x1="15" y1="-5" x2="15" y2="5"/>
        <line x1="19" y1="-5" x2="19" y2="5"/>
        <line x1="23" y1="-5" x2="23" y2="5"/>
        <line x1="27" y1="-5" x2="27" y2="5"/>
        <line x1="31" y1="-5" x2="31" y2="5"/>
        <line x1="35" y1="-5" x2="35" y2="5"/>
        <line x1="39" y1="-5" x2="39" y2="5"/>
        <line x1="43" y1="-5" x2="43" y2="5"/>
      </g>
    </g>
    <g transform="rotate(90)">
      <rect x="6" y="-6" width="44" height="12"/>
      <g stroke="#e0eaeb" stroke-width="1">
        <line x1="11" y1="-5" x2="11" y2="5"/>
        <line x1="15" y1="-5" x2="15" y2="5"/>
        <line x1="19" y1="-5" x2="19" y2="5"/>
        <line x1="23" y1="-5" x2="23" y2="5"/>
        <line x1="27" y1="-5" x2="27" y2="5"/>
        <line x1="31" y1="-5" x2="31" y2="5"/>
        <line x1="35" y1="-5" x2="35" y2="5"/>
        <line x1="39" y1="-5" x2="39" y2="5"/>
        <line x1="43" y1="-5" x2="43" y2="5"/>
      </g>
    </g>
    <g transform="rotate(180)">
      <rect x="6" y="-6" width="44" height="12"/>
      <g stroke="#e0eaeb" stroke-width="1">
        <line x1="11" y1="-5" x2="11" y2="5"/>
        <line x1="15" y1="-5" x2="15" y2="5"/>
        <line x1="19" y1="-5" x2="19" y2="5"/>
        <line x1="23" y1="-5" x2="23" y2="5"/>
        <line x1="27" y1="-5" x2="27" y2="5"/>
        <line x1="31" y1="-5" x2="31" y2="5"/>
        <line x1="35" y1="-5" x2="35" y2="5"/>
        <line x1="39" y1="-5" x2="39" y2="5"/>
        <line x1="43" y1="-5" x2="43" y2="5"/>
      </g>
    </g>
    <g transform="rotate(270)">
      <rect x="6" y="-6" width="44" height="12"/>
      <g stroke="#e0eaeb" stroke-width="1">
        <line x1="11" y1="-5" x2="11" y2="5"/>
        <line x1="15" y1="-5" x2="15" y2="5"/>
        <line x1="19" y1="-5" x2="19" y2="5"/>
        <line x1="23" y1="-5" x2="23" y2="5"/>
        <line x1="27" y1="-5" x2="27" y2="5"/>
        <line x1="31" y1="-5" x2="31" y2="5"/>
        <line x1="35" y1="-5" x2="35" y2="5"/>
        <line x1="39" y1="-5" x2="39" y2="5"/>
        <line x1="43" y1="-5" x2="43" y2="5"/>
      </g>
    </g>
    <!-- Hub circle -->
    <circle r="4"/>
  </g>
</svg>
